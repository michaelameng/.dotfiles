"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[directory]
read_only = ""

[git_branch]
format = "[$branch]($style)"

[git_status]
style = "bold purple"

[cmd_duration]
format = "[$duration]($style)"
