# enable true-color support in tmux
set -ga terminal-overrides ",xterm-wezterm:Tc"
set -g default-terminal "tmux-256color"

# remap prefix from <C-b> to <C-a>
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on # enable mouse support in tmux
set -sg escape-time 10 # make pressing "escape" faster
